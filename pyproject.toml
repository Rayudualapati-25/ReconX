[project]
name = "reconx"
version = "0.1.0"
description = "Payment reconciliation engine: bank statement against ledger, with explained breaks"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.20.1",
    "fastapi>=0.162.0",
    "pandas>=3.1.0",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.16.1",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.1.6",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "hypothesis>=6.170.12",
    "mypy>=2.4.0",
    "pandas-stubs>=3.0.5.260914",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "S", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["app", "tests"]

[tool.ruff.lint.per-file-ignores]
# Tests use bare asserts by design.
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["app", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["-ra", "--strict-markers", "--strict-config"]
xfail_strict = true
filterwarnings = ["error"]

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
show_missing = true
skip_empty = true
fail_under = 80
exclude_also = ['if __name__ == "__main__":']
