# The dashboard's static files, plus /api forwarded to the API so the browser never needs CORS.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # A 100,000-row statement is about 8 MB; the API refuses anything over 25 MB itself.
    client_max_body_size 26m;

    location /api/ {
        proxy_pass http://api:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }

    # Built assets have content hashes in their names, so they can be cached for good.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
